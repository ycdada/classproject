<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据结构 · 智能出卷</title>
  <style>
    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #5b6576;
      background: #f7f8fa;
    }
    #boot-splash .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #dfe3ea;
      border-top-color: #2f6feb;
      border-radius: 50%;
      animation: boot-spin 0.8s linear infinite;
    }
    #boot-splash .text {
      font-size: 14px;
    }
    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="boot-splash">
      <div class="spinner"></div>
      <div class="text">正在启动服务，请稍候…</div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
